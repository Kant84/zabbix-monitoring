apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true

  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://localhost/zabbix/api_jsonrpc.php
    jsonData:
      username: Admin
      password: zabbix
      trends: true
      trendsFrom: 7d
      trendsRange: 4d
      cacheTTL: 1h
    editable: true
