global:
  # Замените на свой SMTP (пример для Gmail с app-password)
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'YOUR_EMAIL@gmail.com'
  smtp_auth_username: 'YOUR_EMAIL@gmail.com'
  smtp_auth_password: 'YOUR_APP_PASSWORD'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 16h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 5s
      repeat_interval: 8h
    - match:
        severity: high
      receiver: 'high'
      group_wait: 10s
      repeat_interval: 16h

receivers:
  # Все алерты дублируются в MAX через webhook-сервер
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5000/webhook'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://localhost:5000/webhook'
        send_resolved: true

  - name: 'high'
    webhook_configs:
      - url: 'http://localhost:5000/webhook'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
