# Zabbix Server Configuration
DBHost=localhost
DBName=zabbix
DBUser=zabbix
# ОБЯЗАТЕЛЬНО замените перед установкой (или задайте через sed в install-server.sh)
DBPassword=zabbix_password_change_me

ListenPort=10051
LogFile=/var/log/zabbix/zabbix_server.log
LogFileSize=0
PidFile=/run/zabbix/zabbix_server.pid

# Cache
CacheSize=32M
HistoryCacheSize=16M
TrendCacheSize=4M
ValueCacheSize=8M

# Timeouts
Timeout=30
TrapperTimeout=300
UnreachablePeriod=45
UnavailableDelay=60

# Starters
StartPollers=10
StartPollersUnreachable=3
StartTrappers=5
StartPingers=2
StartDiscoverers=5
StartHTTPPollers=2
StartTimers=1
StartEscalators=1
StartAlerters=3
StartPreprocessors=3

# Housekeeping
HousekeepingFrequency=1
MaxHousekeeperDelete=5000
