# Zabbix Agent2 Configuration (универсальный шаблон)
PidFile=/run/zabbix/zabbix_agent2.pid
LogFile=/var/log/zabbix/zabbix_agent2.log
LogFileSize=0

# IP центрального сервера подставляет install-agent.sh
Server=127.0.0.1
ServerActive=127.0.0.1

# Имя хоста (по умолчанию = hostname машины)
Hostname=CHANGE_ME

# Гибридный режим: пассивные проверки (порт 10050) + активные
ListenPort=10050
ListenIP=0.0.0.0

RefreshActiveChecks=120
BufferSend=5
BufferSize=100

Timeout=30

# Пользовательские UserParameter (1С, Docker, СКУД)
Include=/etc/zabbix/zabbix_agent2.d/*.conf
