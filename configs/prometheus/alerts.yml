groups:
  - name: server_alerts
    rules:
      - alert: ServerDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Сервер {{ $labels.instance }} недоступен"
          description: "Нет метрик node_exporter более 2 минут (location: {{ $labels.location_type }})"

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU на {{ $labels.instance }}"
          description: "Загрузка CPU выше 85% более 15 минут"

      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокое потребление RAM на {{ $labels.instance }}"
          description: "Использовано более 90% RAM более 10 минут"

      - alert: DiskFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "Заполнение диска на {{ $labels.instance }}"
          description: "Корневой раздел заполнен более чем на 85%"

  # === BliKVM (добавлено v4.2) ===
  - name: blikvm
    rules:
      - alert: BliKvmDown
        expr: up{job=~"blikvm.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BliKVM {{ $labels.instance }} недоступен"
          description: "Не снимаются метрики BliKVM более 2 минут"

      - alert: BliKvmHighTemp
        expr: blikvm_temperature_c > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BliKVM {{ $labels.instance }} перегрев {{ $value }}°C"
          description: "Температура устройства выше 60°C более 5 минут"

      - alert: BliKvmLowMem
        expr: blikvm_mem_available_bytes < 262144000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BliKVM {{ $labels.instance }} мало памяти"
          description: "Доступно менее 250 МБ RAM"

      # === SSD/SMART (v4.2.5, install-addon.sh --smart) ===
      - alert: SmartDeviceUnhealthy
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Диск {{ $labels.device }} на {{ $labels.instance }}: SMART FAILED"
          description: "smartctl: health status не PASSED — диск под замену"

      - alert: SmartDeviceHot
        expr: smartctl_device_temperature > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Перегрев диска {{ $labels.device }} на {{ $labels.instance }}: {{ $value }}°C"

      # === Службы systemd (v4.2.5, install-addon.sh --systemd): ЛЮБАЯ упавшая служба ===
      - alert: SmartWearHigh
        expr: smartctl_device_percentage_used > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Износ NVMe {{ $labels.device }} на {{ $labels.instance }}: {{ $value }}%"
          description: "Percentage Used превысил 80% — планируй замену диска"

      - alert: SystemdServiceFailed
        expr: node_systemd_unit_state{name!="",state="failed"} == 1
        for: 3m
        labels:
          severity: high
        annotations:
          summary: "Служба {{ $labels.name }} упала на {{ $labels.instance }}"
          description: "Служба {{ $labels.name }} упала (systemd unit failed)"

      # BliKvmStorageLow УДАЛЁН в v4.2.1: корневой раздел BliKVM (116 МБ) —
      # это образ системы, он штатно заполнен на 100% (storage_available = 0 — норма).
      # Пользовательские данные живут на /data (проверено: 26 ГБ свободно) и
      # отдельной метрикой не сдаются.
